<!doctype html>

<meta name="description" content="A real-time path tracer in the browser: three scenes lit by simulated light bounces, with glass refraction, dispersion, caustics and click-to-focus depth of field.">
<meta property="og:title" content="Photon Lab">

<body>
<title>Photon Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the render is the page. A quiet caption top-left, a live sample meter top-right, scene and lens controls docked bottom. Single dark look by choice. */
:root{
  --bg:#0b0a09;
  --ink:#f5efe4;
  --dim:#a39a8b;
  --line:rgba(245,239,228,.18);
  --panel:rgba(14,12,10,.6);
  --amber:#ffb454;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;background:var(--bg)}
.cap{position:fixed;z-index:2;pointer-events:none;top:calc(18px + env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px));
  max-width:min(30rem,70vw);display:flex;flex-direction:column;gap:8px;text-shadow:0 1px 14px rgba(0,0,0,.85)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
h1{margin:0;font:400 clamp(34px,6vw,68px)/.95 var(--display);font-style:italic;letter-spacing:-.01em;text-wrap:balance}
.blurb{margin:0;font-size:12.5px;line-height:1.6;opacity:.86}
.meter{position:fixed;z-index:2;pointer-events:none;top:calc(18px + env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px));
  text-align:right;font-size:11px;line-height:1.7;color:var(--dim);font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.meter b{display:block;font:400 30px/1 var(--display);color:var(--amber)}
.dock{position:fixed;z-index:2;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;pointer-events:auto;
  background:var(--panel);border:1px solid var(--line);padding:6px 14px 6px 6px;border-radius:999px;backdrop-filter:blur(12px)}
.tabs{display:flex;gap:4px}
.tabs button{font:500 12px var(--mono);color:var(--dim);background:transparent;border:0;padding:9px 14px;border-radius:999px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
label{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);letter-spacing:.06em}
input[type=range]{width:110px;accent-color:var(--amber)}
.hint{font-size:11px;letter-spacing:.06em;color:var(--dim);text-align:center;text-shadow:0 1px 10px rgba(0,0,0,.9)}
#err{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);line-height:1.6}
@media (max-width:560px){.bar{border-radius:22px;padding:6px}.blurb{display:none}.meter b{font-size:22px}}
</style>

<canvas id="stage" aria-label="Path traced 3D render"></canvas>
<div class="cap">
  <div class="eyebrow">Photon Lab · real-time path tracing</div>
  <h1 id="name">Golden Hour</h1>
  <p class="blurb" id="blurb"></p>
</div>
<div class="meter"><b id="spp">0</b>samples per pixel<br><span id="rays">0</span> rays traced<br><span id="res"></span></div>
<div class="dock">
  <div class="bar">
    <div class="tabs" id="tabs" role="group" aria-label="Scenes"></div>
    <label for="lens">lens blur <input id="lens" type="range" min="0" max="0.5" step="0.01" value="0.1"></label>
  </div>
  <div class="hint">drag to orbit · scroll to zoom · click anything to focus on it · hold still and it sharpens</div>
</div>
<div id="err" hidden>Photon Lab needs WebGL 2 with float render targets,<br>and this browser did not provide them.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('stage');
let R, ok=false;
try{ R=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
  ok=R.capabilities.isWebGL2&&(R.extensions.get('EXT_color_buffer_float')||R.extensions.get('EXT_color_buffer_half_float')); }catch(e){}
if(!ok){ document.getElementById('err').hidden=false; return; }
R.setPixelRatio(1); R.autoClear=false;
const small=Math.min(innerWidth,innerHeight)<600;
const MAXS=20, MAXB=8, MAXSPP=small?1200:2400;

/* ---------- scenes ---------- */
// sphere: [x,y,z,r,  r,g,b,type,  rough,ior,emission|absorb,dispersion]   type 0 diffuse 1 metal 2 glass 3 light 4 ceramic
const SCENES=[
 { name:'Golden Hour', tab:'Golden hour',
   blurb:'Nothing here is drawn. Each pixel fires rays that bounce up to ten times off glass, chrome and ceramic until they find the sun. The rainbow fringes and the bright spots under the glass are the light actually bending.',
   view:[1.22,1.27,13.2],target:[0,1.05,.2],fov:36,lens:.1,focus:[0,1.6,0],exp:.92,
   sunDir:[-.62,.36,.3],sunE:[4.2,3.1,2.0],skyZ:[.08,.2,.66],skyH:[1.0,.56,.32],
   ground:[.5,.47,.45,4,.1,0,0,0],chk:.5,
   s:[[0,1.6,0,1.6, 1,1,1,2, 0,1.5,0,.022],
      [-3.5,1.2,-.7,1.2, .96,.96,.98,1, .015,0,0,0],
      [3.4,1.1,-1,1.1, 1,.74,.3,1, .2,0,0,0],
      [-1.9,.7,2.5,.7, .86,.06,.09,4, .04,0,0,0],
      [2,.75,2.4,.75, .25,.92,.78,2, 0,1.5,1.4,0],
      [.1,.5,3.5,.5, 1,1,1,2, 0,2.3,0,.11],
      [-4.7,.6,2.3,.6, 1,.45,.14,3, 0,0,6,0],
      [4.4,.5,1.8,.5, .5,.25,.85,0, 0,0,0,0],
      [2.7,.9,-3.5,.9, 1,1,1,2, .22,1.5,0,0],
      [-3.2,.8,-3.6,.8, .08,.22,.9,4, .06,0,0,0],
      [-.3,.45,-3.4,.45, .95,.9,.8,0, 0,0,0,0],
      [-5.6,.4,-.6,.4, .98,.6,.55,1, .08,0,0,0]],
   b:[[4.9,.002,-.2, 6.1,1.2,1, .92,.97,1,2, 0,1.52,.35,.05]] },
 { name:'The Box', tab:'The box',
   blurb:'The classic test of a renderer: one light in the ceiling and two coloured walls. The red and green tint on the white surfaces is light that bounced off the walls first. No shading tricks, only bounces.',
   view:[1.5708,1.42,13.2],target:[0,2.9,0],fov:36,lens:.03,focus:[1.3,1.2,.6],exp:.82,
   sunDir:[0,1,0],sunE:[0,0,0],skyZ:[0,0,0],skyH:[0,0,0],
   ground:[.78,.78,.78,0,0,0,0,0],chk:1,
   s:[[1.35,1.2,.7,1.2, 1,1,1,2, 0,1.5,0,.015],
      [-1.5,.75,1.5,.75, .96,.96,.98,1, .01,0,0,0],
      [.2,.4,2.2,.4, 1,.74,.3,1, .16,0,0,0]],
   b:[[-3.2,0,-3.2, 3.2,6.2,-3, .78,.78,.78,0, 0,0,0,0],
      [-3.2,0,-3.2, -3,6.2,3, .8,.07,.06,0, 0,0,0,0],
      [3,0,-3.2, 3.2,6.2,3, .09,.62,.12,0, 0,0,0,0],
      [-3.2,6,-3.2, 3.2,6.2,3, .78,.78,.78,0, 0,0,0,0],
      [-1.5,5.9,-1.5, 1.5,6.02,1.5, 1,.9,.72,3, 0,0,12,0],
      [-2.3,0,-2.2, -.7,3.7,-.6, .78,.78,.78,0, 0,0,0,0]] },
 { name:'Night Marbles', tab:'Night marbles',
   blurb:'No sun and no lamps. The only light in this scene comes from the glowing spheres themselves, carried through glass and across the wet floor one bounce at a time. Push the lens blur up.',
   view:[.9,1.3,11.5],target:[0,.9,0],fov:38,lens:.2,focus:[0,1.5,0],exp:1.25,
   sunDir:[0,1,0],sunE:[0,0,0],skyZ:[.012,.02,.05],skyH:[.03,.025,.05],
   ground:[.06,.06,.07,4,.06,0,0,0],chk:1,
   s:(function(){ const a=[[0,1.5,0,1.5, .97,.97,1,1, .01,0,0,0]];
      const glow=[[1,.25,.5],[.2,.8,1],[1,.6,.15],[.6,.35,1],[.3,1,.6]], tint=[[1,.6,.7],[.6,.85,1],[1,.9,.6],[.8,.7,1]];
      for(let i=0;i<14;i++){ const an=i/14*6.2832, rr=i%2?3.5:4.6;
        if(i%2===0){ const g=glow[(i/2)%5|0]; a.push([Math.cos(an)*rr,.55,Math.sin(an)*rr,.55, g[0],g[1],g[2],3, 0,0,5.5,0]); }
        else { const t=tint[((i-1)/2)%4|0]; a.push([Math.cos(an)*rr,.8,Math.sin(an)*rr,.8, t[0],t[1],t[2],2, 0,1.5,.9,.012]); } }
      a.push([1.1,.35,2.1,.35, 1,1,1,2, 0,2.3,0,.1]); a.push([-1.6,.3,1.9,.3, 1,.74,.3,1, .1,0,0,0]); return a; })(),
   b:[] }
];

/* ---------- shaders ---------- */
const VERT=`void main(){gl_Position=vec4(position.xy,0.,1.);}`;
const TRACE=`
#define MAXS ${MAXS}
#define MAXB ${MAXB}
#define EPS .0015
uniform sampler2D uPrev; uniform vec2 uRes; uniform float uFrame,uTanF,uAp,uFocus,uChk,uSunCos; uniform int uNS,uNB,uSpp;
uniform vec3 uO,uR,uU,uF,uSunDir,uSunE,uSkyZ,uSkyH;
uniform vec4 uSph[MAXS],uSM[MAXS],uSP[MAXS],uBM[MAXB],uBP[MAXB],uGM,uGP; uniform vec3 uB0[MAXB],uB1[MAXB];
uint seed;
float rnd(){ seed=seed*747796405u+2891336453u; uint w=((seed>>((seed>>28u)+4u))^seed)*277803737u; w=(w>>22u)^w; return float(w)*(1./4294967296.); }
vec3 rsph(){ float z=1.-2.*rnd(),a=6.2831853*rnd(),r=sqrt(max(0.,1.-z*z)); return vec3(r*cos(a),r*sin(a),z); }
bool hit(vec3 ro,vec3 rd,out float t,out vec3 n,out vec4 m,out vec4 p){
  t=1e9;
  for(int i=0;i<MAXS;i++){ if(i>=uNS)break; vec4 s=uSph[i]; vec3 oc=ro-s.xyz; float b=dot(oc,rd),c=dot(oc,oc)-s.w*s.w,h=b*b-c;
    if(h>0.){ h=sqrt(h); float t0=-b-h; if(t0<EPS)t0=-b+h; if(t0>EPS&&t0<t){ t=t0; n=(ro+rd*t0-s.xyz)/s.w; m=uSM[i]; p=uSP[i]; } } }
  vec3 inv=1./(rd+vec3(1e-9));
  for(int i=0;i<MAXB;i++){ if(i>=uNB)break; vec3 a=(uB0[i]-ro)*inv,b=(uB1[i]-ro)*inv,lo=min(a,b),hi=max(a,b);
    float tn=max(max(lo.x,lo.y),lo.z),tf=min(min(hi.x,hi.y),hi.z);
    if(tn<tf&&tf>EPS){ if(tn>EPS){ if(tn<t){ t=tn; n=-sign(rd)*step(lo.yzx,lo.xyz)*step(lo.zxy,lo.xyz); m=uBM[i]; p=uBP[i]; } }
      else if(tf<t){ t=tf; n=sign(rd)*step(hi.xyz,hi.yzx)*step(hi.xyz,hi.zxy); m=uBM[i]; p=uBP[i]; } } }
  if(rd.y<0.&&ro.y>0.){ float tp=-ro.y/rd.y; if(tp>EPS&&tp<t){ t=tp; n=vec3(0.,1.,0.); m=uGM; p=uGP;
      vec2 q=floor((ro.xz+rd.xz*tp)*.5); if(mod(q.x+q.y,2.)<.5) m.rgb*=uChk; } }
  return t<1e8;
}
vec3 sky(vec3 d,bool spec){ vec3 c=d.y>0.?mix(uSkyH,uSkyZ,pow(d.y,.42)):uSkyH*.35;
  if(spec&&uSunE.r>0.&&dot(d,uSunDir)>uSunCos) c+=uSunE/(6.2831853*(1.-uSunCos)); return c; }
vec3 trace(vec3 ro,vec3 rd){
  vec3 L=vec3(0.),T=vec3(1.); bool spec=true; int ch=-1; float t; vec3 n; vec4 m,p;
  for(int b=0;b<10;b++){
    if(!hit(ro,rd,t,n,m,p)){ L+=T*sky(rd,spec); break; }
    vec3 pos=ro+rd*t; bool inside=dot(rd,n)>0.; vec3 nf=inside?-n:n; int ty=int(m.w+.5);
    if(ty==3){ L+=T*m.rgb*p.z; break; }
    bool diffuse=ty==0;
    if(ty==4){ float c=1.-max(dot(-rd,nf),0.); float F=.04+.96*c*c*c*c*c;
      if(rnd()<F){ rd=normalize(reflect(rd,nf)+p.x*rsph()); if(dot(rd,nf)<=0.)break; ro=pos+nf*EPS; spec=true; } else diffuse=true; }
    if(diffuse){ T*=m.rgb;
      if(uSunE.r>0.){ vec3 w=uSunDir,u=normalize(cross(abs(w.y)<.99?vec3(0.,1.,0.):vec3(1.,0.,0.),w)),v=cross(w,u);
        float cz=1.-rnd()*(1.-uSunCos),sz=sqrt(1.-cz*cz),a=6.2831853*rnd(); vec3 l=u*cos(a)*sz+v*sin(a)*sz+w*cz; float ndl=dot(nf,l);
        if(ndl>0.){ float t2; vec3 n2; vec4 m2,p2; if(!hit(pos+nf*EPS,l,t2,n2,m2,p2)) L+=T*uSunE*ndl*.31831; } }
      rd=normalize(nf+rsph()); ro=pos+nf*EPS; spec=false; }
    else if(ty==1){ rd=normalize(reflect(rd,nf)+p.x*rsph()); if(dot(rd,nf)<=0.)break; T*=m.rgb; ro=pos+nf*EPS; spec=true; }
    else if(ty==2){ float ior=p.y;
      if(p.w>0.){ if(ch<0){ ch=min(int(rnd()*3.),2); vec3 k=vec3(0.); k[ch]=3.; T*=k; } ior+=(float(ch)-1.)*p.w; }
      if(inside) T*=exp(-(1.-m.rgb)*p.z*t);
      float eta=inside?ior:1./ior,ci=dot(-rd,nf),k2=1.-eta*eta*(1.-ci*ci); float r0=(1.-ior)/(1.+ior); r0*=r0;
      float cx=inside?sqrt(max(k2,0.)):ci; float F=k2<0.?1.:r0+(1.-r0)*pow(1.-cx,5.);
      if(rnd()<F){ rd=reflect(rd,nf); ro=pos+nf*EPS; } else { rd=normalize(eta*rd+(eta*ci-sqrt(k2))*nf+p.x*rsph()); ro=pos-nf*EPS; }
      spec=true; }
    if(b>2){ float q=min(max(T.r,max(T.g,T.b)),.95); if(rnd()>q)break; T/=q; }
  }
  return L;
}
void main(){
  seed=(uint(gl_FragCoord.x)*1973u+uint(gl_FragCoord.y)*9277u+uint(uFrame)*26699u)|1u; rnd();
  vec3 acc=vec3(0.);
  for(int s=0;s<4;s++){ if(s>=uSpp)break;
    vec2 uv=((gl_FragCoord.xy+vec2(rnd(),rnd())-.5)*2.-uRes)/uRes.y;
    vec3 d=normalize(uR*uv.x*uTanF+uU*uv.y*uTanF+uF);
    vec3 fp=uO+d*(uFocus/dot(d,uF));
    float a=6.2831853*rnd(),r=sqrt(rnd())*uAp; vec3 ro=uO+(uR*cos(a)+uU*sin(a))*r;
    vec3 c=trace(ro,normalize(fp-ro)); if(c!=c) c=vec3(0.); acc+=min(c,vec3(30.)); }
  acc/=float(uSpp);
  vec3 prev=texelFetch(uPrev,ivec2(gl_FragCoord.xy),0).rgb;
  gl_FragColor=vec4(mix(prev,acc,1./(uFrame+1.)),1.);
}`;
const SHOW=`uniform sampler2D uTex; uniform vec2 uRes; uniform float uExp;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
void main(){ vec2 uv=gl_FragCoord.xy/uRes; vec3 c=texture2D(uTex,uv).rgb*uExp;
  vec2 q=uv-.5; c*=1.-dot(q,q)*.55; c=pow(aces(c),vec3(1./2.2));
  c+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)/255.;
  gl_FragColor=vec4(c,1.); }`;

const V3=()=>new THREE.Vector3(), V4=()=>new THREE.Vector4();
const arr=(n,f)=>Array.from({length:n},f);
const U={uPrev:{value:null},uRes:{value:new THREE.Vector2()},uFrame:{value:0},uTanF:{value:.3},uAp:{value:.1},uFocus:{value:10},uChk:{value:1},
  uSunCos:{value:Math.cos(5*Math.PI/180)},uNS:{value:0},uNB:{value:0},uSpp:{value:2},
  uO:{value:V3()},uR:{value:V3()},uU:{value:V3()},uF:{value:V3()},uSunDir:{value:V3()},uSunE:{value:V3()},uSkyZ:{value:V3()},uSkyH:{value:V3()},
  uSph:{value:arr(MAXS,V4)},uSM:{value:arr(MAXS,V4)},uSP:{value:arr(MAXS,V4)},uBM:{value:arr(MAXB,V4)},uBP:{value:arr(MAXB,V4)},
  uB0:{value:arr(MAXB,V3)},uB1:{value:arr(MAXB,V3)},uGM:{value:V4()},uGP:{value:V4()}};
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:U,vertexShader:VERT,fragmentShader:TRACE,depthTest:false,depthWrite:false}));
quad.frustumCulled=false; const sceneT=new THREE.Scene(); sceneT.add(quad);
const US={uTex:{value:null},uRes:{value:new THREE.Vector2()},uExp:{value:1}};
const quad2=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:US,vertexShader:VERT,fragmentShader:SHOW,depthTest:false,depthWrite:false}));
quad2.frustumCulled=false; const sceneS=new THREE.Scene(); sceneS.add(quad2);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const cam=new THREE.PerspectiveCamera(36,1,.1,100);

let rtA=null,rtB=null,rw=0,rh=0;
function makeRT(w,h){ return new THREE.WebGLRenderTarget(w,h,{type:THREE.HalfFloatType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:false,stencilBuffer:false}); }

/* ---------- state ---------- */
const orbit={th:0,ph:1,d:10,vth:0,vph:0,drag:false}, target=new THREE.Vector3(), focusPt=new THREE.Vector3();
let S=null,cur=-1,frame=0,dirty=true;
const nameEl=document.getElementById('name'),blurbEl=document.getElementById('blurb'),sppEl=document.getElementById('spp'),raysEl=document.getElementById('rays'),resEl=document.getElementById('res'),
      tabs=document.getElementById('tabs'),lens=document.getElementById('lens');
SCENES.forEach((s,i)=>{ const b=document.createElement('button'); b.type='button'; b.id='scene-'+i; b.textContent=s.tab; b.setAttribute('aria-pressed','false'); b.addEventListener('click',()=>show(i)); tabs.appendChild(b); });
function show(i){
  i=(i+SCENES.length)%SCENES.length; if(i===cur) return; cur=i; S=SCENES[i];
  S.s.forEach((s,k)=>{ U.uSph.value[k].set(s[0],s[1],s[2],s[3]); U.uSM.value[k].set(s[4],s[5],s[6],s[7]); U.uSP.value[k].set(s[8],s[9],s[10],s[11]); });
  S.b.forEach((b,k)=>{ U.uB0.value[k].set(b[0],b[1],b[2]); U.uB1.value[k].set(b[3],b[4],b[5]); U.uBM.value[k].set(b[6],b[7],b[8],b[9]); U.uBP.value[k].set(b[10],b[11],b[12],b[13]); });
  U.uNS.value=S.s.length; U.uNB.value=S.b.length; U.uGM.value.set(S.ground[0],S.ground[1],S.ground[2],S.ground[3]); U.uGP.value.set(S.ground[4],S.ground[5],S.ground[6],S.ground[7]);
  U.uChk.value=S.chk; U.uSunDir.value.fromArray(S.sunDir).normalize(); U.uSunE.value.fromArray(S.sunE); U.uSkyZ.value.fromArray(S.skyZ); U.uSkyH.value.fromArray(S.skyH);
  orbit.th=S.view[0]; orbit.ph=S.view[1]; orbit.d=S.view[2]; orbit.vth=orbit.vph=0; target.fromArray(S.target); focusPt.fromArray(S.focus);
  lens.value=S.lens; U.uAp.value=S.lens; US.uExp.value=S.exp;
  nameEl.textContent=S.name; blurbEl.textContent=S.blurb;
  [...tabs.children].forEach((b,k)=>b.setAttribute('aria-pressed',k===i?'true':'false'));
  lw=0; dirty=true;
  try{ localStorage.setItem('pl-scene',String(i)); }catch(e){}
}
let lw=0,lh=0;
function resize(){
  const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight; if(w<2||h<2||(w===lw&&h===lh)) return; lw=w; lh=h;
  const dpr=Math.min(devicePixelRatio||1,2); R.setSize(Math.round(w*dpr),Math.round(h*dpr),false);
  const budget=small?4.2e5:9.5e5, k=Math.min(1,Math.sqrt(budget/(w*h*dpr*dpr)));
  rw=Math.max(2,Math.round(w*dpr*k)); rh=Math.max(2,Math.round(h*dpr*k));
  if(rtA){ rtA.dispose(); rtB.dispose(); } rtA=makeRT(rw,rh); rtB=makeRT(rw,rh);
  U.uRes.value.set(rw,rh); R.getDrawingBufferSize(US.uRes.value);
  const tall=w<h; cam.fov=(S?S.fov:36)*(tall?1.55:1); U.uTanF.value=Math.tan(cam.fov*Math.PI/360);
  resEl.textContent=rw+' × '+rh; dirty=true;
}

/* ---------- focus picking (same maths as the shader, on the CPU) ---------- */
function pick(ro,rd){ let t=1e9;
  for(const s of S.s){ const ox=ro.x-s[0],oy=ro.y-s[1],oz=ro.z-s[2]; const b=ox*rd.x+oy*rd.y+oz*rd.z,c=ox*ox+oy*oy+oz*oz-s[3]*s[3],h=b*b-c; if(h>0){ const t0=-b-Math.sqrt(h); if(t0>.01&&t0<t) t=t0; } }
  for(const b of S.b){ let tn=-1e9,tf=1e9; for(let a=0;a<3;a++){ const o=[ro.x,ro.y,ro.z][a],d=[rd.x,rd.y,rd.z][a]||1e-9; let t1=(b[a]-o)/d,t2=(b[a+3]-o)/d; if(t1>t2){ const x=t1;t1=t2;t2=x; } tn=Math.max(tn,t1); tf=Math.min(tf,t2); } if(tn<tf&&tn>.01&&tn<t) t=tn; }
  if(rd.y<0){ const tp=-ro.y/rd.y; if(tp>.01&&tp<t) t=tp; }
  return t<1e8?t:-1; }
const ptrs=new Map(); let moved=0,pinch=0;
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]); moved=0; orbit.drag=true;
  if(ptrs.size===2){ const a=[...ptrs.values()]; pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]); moved=99; } });
canvas.addEventListener('pointermove',e=>{ const p=ptrs.get(e.pointerId); if(!p) return; const dx=e.clientX-p[0],dy=e.clientY-p[1]; p[0]=e.clientX; p[1]=e.clientY;
  if(ptrs.size===1){ moved+=Math.abs(dx)+Math.abs(dy); if(moved>4){ orbit.th+=dx*.006; orbit.ph-=dy*.006; dirty=true; } }
  else if(ptrs.size===2){ const a=[...ptrs.values()]; const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]); if(pinch>0) zoom(pinch/d); pinch=d; } });
function up(e){ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if(ptrs.size) return; orbit.drag=false;
  if(moved<=4&&e.type==='pointerup'){ const r=canvas.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width*2-1)*(r.width/r.height), y=-((e.clientY-r.top)/r.height*2-1);
    const tf=U.uTanF.value, d=new THREE.Vector3().copy(U.uR.value).multiplyScalar(x*tf).addScaledVector(U.uU.value,y*tf).add(U.uF.value).normalize();
    const t=pick(cam.position,d); if(t>0){ focusPt.copy(cam.position).addScaledVector(d,t); dirty=true; } } }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
function zoom(f){ orbit.d=Math.min(S.view[2]*2.2,Math.max(S.view[2]*.35,orbit.d*f)); dirty=true; }
canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoom(Math.exp(e.deltaY*.0012)); },{passive:false});
lens.addEventListener('input',()=>{ U.uAp.value=+lens.value; dirty=true; });
addEventListener('keydown',e=>{ if(e.key>='1'&&e.key<='3') show(+e.key-1); else if(e.key==='ArrowRight') show(cur+1); else if(e.key==='ArrowLeft') show(cur-1); });

/* ---------- loop ---------- */
let rays=0; const nf=new Intl.NumberFormat('en');
function frameFn(){ requestAnimationFrame(frameFn); tick(); }
function tick(){
  resize(); if(!rtA) return;
  if(dirty){
    orbit.ph=Math.min(1.53,Math.max(.12,orbit.ph)); const sp=Math.sin(orbit.ph);
    cam.position.set(target.x+orbit.d*sp*Math.cos(orbit.th),target.y+orbit.d*Math.cos(orbit.ph),target.z+orbit.d*sp*Math.sin(orbit.th));
    cam.lookAt(target); cam.updateMatrixWorld();
    U.uO.value.copy(cam.position); U.uR.value.setFromMatrixColumn(cam.matrixWorld,0); U.uU.value.setFromMatrixColumn(cam.matrixWorld,1); U.uF.value.setFromMatrixColumn(cam.matrixWorld,2).negate();
    U.uFocus.value=Math.max(.5,new THREE.Vector3().subVectors(focusPt,cam.position).dot(U.uF.value));
    frame=0; rays=0; dirty=false;
  }
  if(frame<MAXSPP){
    const spp=orbit.drag||frame<4?1:(small?1:2); U.uSpp.value=spp; U.uFrame.value=frame; U.uPrev.value=rtB.texture;
    R.setRenderTarget(rtA); R.render(sceneT,ortho); const t=rtA; rtA=rtB; rtB=t; frame++; rays+=spp*rw*rh;
    if(frame%6===0||frame<3){ sppEl.textContent=nf.format(frame*(small?1:2)); raysEl.textContent=rays>1e9?(rays/1e9).toFixed(2)+' billion':nf.format(Math.round(rays/1e6))+' million'; }
  }
  R.setRenderTarget(null); US.uTex.value=rtB.texture; R.render(sceneS,ortho);
}
let start=0; try{ const v=parseInt(localStorage.getItem('pl-scene'),10); if(v>=0&&v<SCENES.length) start=v; }catch(e){}
show(start); requestAnimationFrame(frameFn);
})();
</script>
